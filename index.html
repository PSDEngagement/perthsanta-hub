    html, body {
      background: #070707 !important;

    /* Event cards container */

      gap: 0.65rem;

    /* tablet / laptop: nằm ngang 2 cột */

    /* Event card – compact, no image */
    .event-live {
      display: block;

      border: 1px solid #5c1a1a;

    }
    .event-live:hover {
      border-color: #991b1b;
      box-shadow: 0 6px 20px rgba(185, 28, 28, 0.18);
    }
    .event-live.upcoming {
      border-color: #3f1a1a;
      background: linear-gradient(165deg, #141010 0%, #0f0f0f 50%, #0a0a0a 100%);
    }
    .event-live.upcoming:hover {

    .ev-top {
      display: flex;

      gap: 0.5rem;
      margin-bottom: 0.35rem;

    .ev-badge {
      display: inline-flex;

    .live-dot {
      width: 0.45rem;

      border-radius: 9999px;

      flex-shrink: 0;
    }

      width: 0.45rem;
      height: 0.45rem;
      border-radius: 9999px;
      background: #a1a1aa;
      flex-shrink: 0;
    }

      0%, 100% { opacity: 1; transform: scale(1); }

        display: grid;

  <script>
  (function () {
    // ========== Helpers ==========
    const MONTHS = {
      jan: 0, feb: 1, mar: 2, apr: 3, may: 4, jun: 5,
      jul: 6, aug: 7, sep: 8, oct: 9, nov: 10, dec: 11
    };

    /** Parse "6 Oct" or "06 Oct" → { day, monthIndex } */
    function parseDateLabel(label) {
      if (!label) return null;
      const m = String(label).trim().match(/^(\d{1,2})\s+([A-Za-z]{3})/);
      if (!m) return null;
      const day = parseInt(m[1], 10);
      const monthIndex = MONTHS[m[2].toLowerCase()];
      if (monthIndex === undefined) return null;
      return { day, monthIndex };
    }

    /**
     * Parse time from note field.
     * Supports: "05:30 PM (UTC+7)", "5:30 PM", "17:30", "ALL DAY", "TBA"
     * Returns minutes-from-midnight, or null if unparseable / all-day.
     */
    function parseTimeToMinutes(note) {
      if (!note) return null;
      const s = String(note).trim().toUpperCase();
      if (s === "ALL DAY" || s === "TBA" || s === "N/A") return null;

      // 12h: 05:30 PM / 5:30PM / 5.30 PM
      let m = s.match(/(\d{1,2})[:.](\d{2})\s*(AM|PM)/);
      if (m) {
        let h = parseInt(m[1], 10);
        const min = parseInt(m[2], 10);
        const ap = m[3];
        if (ap === "PM" && h < 12) h += 12;
        if (ap === "AM" && h === 12) h = 0;
        return h * 60 + min;
      }

      // 24h: 17:30
      m = s.match(/(\d{1,2})[:.](\d{2})/);
      if (m) {
        return parseInt(m[1], 10) * 60 + parseInt(m[2], 10);
      }
      return null;
    }

    /** Format display time: "5:30 PM BKK" */
    function formatDisplayTime(note) {
      if (!note) return "";
      const s = String(note).trim();
      if (/ALL DAY/i.test(s)) return "ALL DAY";
      if (/TBA/i.test(s)) return "TBA";
      // strip (UTC+7) etc
      return s.replace(/\s*\([^)]*\)\s*/g, "").trim() + " BKK";
    }

    /** Format date label for card: "06 OCT" */
    function formatDateShort(day, monthIndex) {
      const names = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
      return String(day).padStart(2, "0") + " " + names[monthIndex];
    }

    /**
     * Status logic (timezone: Asia/Bangkok ≈ UTC+7):
     * Mỗi sự kiện kéo dài cả ngày (24h trong ngày đó).
     * - UPCOMING: chưa tới giờ bắt đầu
     * - LIVE:    đã tới hoặc qua giờ bắt đầu (còn trong ngày)
     * - Không còn ENDED giữa ngày
     */
    function getStatus(startMinutes, nowMinutes) {
      if (startMinutes === null) return "live"; // ALL DAY / TBA → LIVE cả ngày
      if (nowMinutes < startMinutes) return "upcoming";
      return "live";
    }

    function buildCard(ev, status) {
      const isLive = status === "live";
      const isPast = status === "past";
      const cls = "event-live" + (isLive ? "" : " upcoming") + (isPast ? " opacity-60" : "");

      const badgeDot = isLive
        ? '<span class="live-dot"></span>'
        : '<span class="upcoming-dot"></span>';
      const badgeText = isLive ? "LIVE NOW" : (isPast ? "ENDED" : "UPCOMING");
      const badgeColor = isLive ? "text-red-400" : "text-zinc-400";

      const hashtag = (ev.hastag && ev.hastag !== "TBA")
        ? "#" + ev.hastag.replace(/^#/, "")
        : "";
      const keyword = (ev.keyword && ev.keyword !== "TBA") ? ev.keyword : "";

      const timeStr = formatDisplayTime(ev.note);
      const dateStr = formatDateShort(ev._day, ev._monthIndex);

      // Gen links: if data has generators use them, else fallback to event-today
      const gens = Array.isArray(ev.generators) && ev.generators.length
        ? ev.generators.slice(0, 2)
        : [
            { name: "Gen 1", url: "event-today.html" },
            { name: "Gen 2", url: "event-today.html" }
          ];

      const genHtml = gens.map(function (g, i) {
        return '<a href="' + (g.url || "event-today.html") + '" target="_blank" rel="noopener" class="ev-gen" onclick="event.stopPropagation()">' +
          (g.name || ("Gen " + (i + 1))) +
          "</a>";
      }).join("");

      let tagsHtml = "";
      if (hashtag) tagsHtml += '<span class="ev-tag hashtag">' + hashtag + "</span>";
      if (keyword) tagsHtml += '<span class="ev-tag keyword">' + keyword + "</span>";

      return (
        '<div class="' + cls + '">' +
          '<div class="ev-top">' +
            '<div class="ev-badge">' +
              badgeDot +
              '<span class="text-[11px] font-bold tracking-wide ' + badgeColor + ' uppercase">' + badgeText + "</span>" +
            "</div>" +
          "</div>" +
          '<p class="ev-title">' + (ev.title || "Event") + "</p>" +
          '<div class="ev-meta">' +
            '<span class="inline-flex items-center gap-1">' +
              '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>' +
              dateStr +
            "</span>" +
            (timeStr
              ? '<span class="inline-flex items-center gap-1">' +
                  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>' +
                  timeStr +
                "</span>"
              : "") +
          "</div>" +
          (tagsHtml ? '<div class="ev-tags">' + tagsHtml + "</div>" : "") +
          '<div class="ev-bottom">' +
            '<div class="ev-gens">' + genHtml + "</div>" +
            '<a href="event-today.html" class="ev-view ' + (isLive ? "live" : "upcoming") + '">' +
              "VIEW" +
              '<svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg>' +
            "</a>" +
          "</div>" +
        "</div>"
      );
    }

    // ========== Main ==========
    const container = document.getElementById("events-stack");
    if (!container) return;

    // Current time in UTC+7 (Bangkok)
    const now = new Date();
    // offset so we work in BKK wall-clock
    const bkkOffsetMs = 7 * 60 * 60 * 1000;
    const utc = now.getTime() + now.getTimezoneOffset() * 60000;
    const bkk = new Date(utc + bkkOffsetMs);
    const todayDay = bkk.getDate();
    const todayMonth = bkk.getMonth(); // 0-11
    const nowMinutes = bkk.getHours() * 60 + bkk.getMinutes();

    fetch("data.json?t=" + Date.now())
      .then(function (r) { return r.json(); })
      .then(function (data) {
        const schedule = (data.introduce && data.introduce.schedule) || [];
        const todayEvents = [];

        schedule.forEach(function (monthBlock) {
          (monthBlock.items || []).forEach(function (item) {
            const parsed = parseDateLabel(item.date);
            if (!parsed) return;
            if (parsed.day === todayDay && parsed.monthIndex === todayMonth) {
              todayEvents.push({
                title: item.title,
                note: item.note,
                location: item.location,
                hastag: item.hastag,
                keyword: item.keyword,
                for: item.for,
                _day: parsed.day,
                _monthIndex: parsed.monthIndex,
                _startMin: parseTimeToMinutes(item.note)
              });
            }
          });
        });

        // Sort by start time (nulls last)
        todayEvents.sort(function (a, b) {
          if (a._startMin === null && b._startMin === null) return 0;
          if (a._startMin === null) return 1;
          if (b._startMin === null) return -1;
          return a._startMin - b._startMin;
        });

        if (todayEvents.length === 0) {
          container.innerHTML =
            '<div class="event-live upcoming opacity-70">' +
              '<p class="ev-title">No events today</p>' +
              '<div class="ev-meta">Check the full schedule in Intro</div>' +
              '<div class="ev-bottom">' +
                '<div></div>' +
                '<a href="introduce.html" class="ev-view upcoming">Schedule →</a>' +
              "</div>" +
            "</div>";
          return;
        }

        container.innerHTML = todayEvents
          .map(function (ev) {
            const status = getStatus(ev._startMin, nowMinutes);
            return buildCard(ev, status);
          })
          .join("");
      })
      .catch(function (err) {
        console.warn("Failed to load events:", err);
        container.innerHTML =
          '<div class="event-live upcoming">' +
            '<p class="ev-title">Could not load events</p>' +
            '<div class="ev-meta">Please refresh the page</div>' +
          "</div>";
      });
  })();
</script>
<script src="common.js"></script>
</body>
</html>
