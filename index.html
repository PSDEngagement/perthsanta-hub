  <script>
  (function () {

    const MONTHS = {
      jan: 0,
      feb: 1,
      mar: 2,
      apr: 3,
      may: 4,
      jun: 5,
      jul: 6,
      aug: 7,
      sep: 8,
      oct: 9,
      nov: 10,
      dec: 11
    };


    function parseDateLabel(label) {

      if (!label) return null;

      const m = String(label)
        .trim()
        .match(/^(\d{1,2})\s+([A-Za-z]{3})/);

      if (!m) return null;

      const day = parseInt(m[1], 10);

      const monthIndex =
        MONTHS[m[2].toLowerCase()];

      if (monthIndex === undefined) {
        return null;
      }

      return {
        day,
        monthIndex
      };
    }


    function parseTimeToMinutes(note) {

      if (!note) return null;

      const s =
        String(note)
          .trim()
          .toUpperCase();

      if (
        s === "ALL DAY" ||
        s === "TBA" ||
        s === "N/A"
      ) {
        return null;
      }


      let m =
        s.match(
          /(\d{1,2})[:.](\d{2})\s*(AM|PM)/
        );

      if (m) {

        let h =
          parseInt(m[1], 10);

        const min =
          parseInt(m[2], 10);

        const ap = m[3];

        if (ap === "PM" && h < 12) {
          h += 12;
        }

        if (ap === "AM" && h === 12) {
          h = 0;
        }

        return h * 60 + min;
      }


      m =
        s.match(
          /(\d{1,2})[:.](\d{2})/
        );

      if (m) {

        return (
          parseInt(m[1], 10) * 60 +
          parseInt(m[2], 10)
        );
      }

      return null;
    }


    function formatDisplayTime(note) {

      if (!note) return "";

      const s =
        String(note).trim();

      if (/ALL DAY/i.test(s)) {
        return "ALL DAY";
      }

      if (/TBA/i.test(s)) {
        return "TBA";
      }

      return (
        s
          .replace(/\s*\([^)]*\)\s*/g, "")
          .trim() +
        " BKK"
      );
    }


    function formatDateShort(day, monthIndex) {

      const names = [
        "JAN",
        "FEB",
        "MAR",
        "APR",
        "MAY",
        "JUN",
        "JUL",
        "AUG",
        "SEP",
        "OCT",
        "NOV",
        "DEC"
      ];

      return (
        String(day).padStart(2, "0") +
        " " +
        names[monthIndex]
      );
    }


    function getStatus(event, nowDate) {

  if (event._startMin === null) {
    return "live";
  }

  const eventStart =
    new Date(
      nowDate.getFullYear(),
      event._monthIndex,
      event._day,
      Math.floor(event._startMin / 60),
      event._startMin % 60,
      0,
      0
    );

  const eventEnd =
    new Date(
      eventStart.getTime() +
      24 * 60 * 60 * 1000
    );

  if (nowDate < eventStart) {
    return "upcoming";
  }

  if (nowDate >= eventEnd) {
    return "past";
  }

  return "live";
}

    /* =========================================================
       HEARTS

       PERTH     = BLACK
       SANTA     = WHITE
       PS        = BLACK + WHITE
       PSD       = BLACK + WHITE + RED

       Always:
       BLACK → WHITE → RED
       ========================================================= */

    function getAudienceHearts(audience) {

      const values =
        Array.isArray(audience)
          ? audience.map(function (item) {
              return String(item || "")
                .trim()
                .toUpperCase();
            })
          : [
              String(audience || "")
                .trim()
                .toUpperCase()
            ];


      const hearts = [];


      if (
        values.includes("PERTH") ||
        values.includes("PS") ||
        values.includes("PERTHSANTA") ||
        values.includes("PSD")
      ) {

        hearts.push(
          '<span class="heart-black" aria-label="Perth">♥</span>'
        );

      }


      if (
        values.includes("SANTA") ||
        values.includes("PS") ||
        values.includes("PERTHSANTA") ||
        values.includes("PSD")
      ) {

        hearts.push(
          '<span class="heart-white" aria-label="Santa">♥</span>'
        );

      }


      if (
        values.includes("PSD")
      ) {

        hearts.push(
          '<span class="heart-red" aria-label="Domiia">♥</span>'
        );

      }


      return hearts.join("");
    }


    // =========================================================
    // Build Event Card
    // =========================================================

    function buildCard(ev, status) {

      const isLive =
        status === "live";

      const isPast =
        status === "past";

      const cls =
        "event-live" +
        (isLive ? "" : " upcoming") +
        (isPast ? " opacity-60" : "");


      // -------------------------------------------------------
      // LIVE / UPCOMING badge
      // -------------------------------------------------------

      const badgeDot =
        isLive
          ? '<span class="live-dot"></span>'
          : '<span class="upcoming-dot"></span>';


      const badgeText =
        isLive
          ? "LIVE NOW"
          : (isPast ? "ENDED" : "UPCOMING");


      const badgeClass =
        isLive
          ? "live-text"
          : "text-zinc-400";


      // -------------------------------------------------------
      // Hearts
      // -------------------------------------------------------

      const heartsHtml =
        getAudienceHearts(ev.for);


      // -------------------------------------------------------
      // Hashtag
      // -------------------------------------------------------

      const hashtag =
        (ev.hastag && ev.hastag !== "TBA")
          ? "#" + ev.hastag.replace(/^#/, "")
          : "";


      // -------------------------------------------------------
      // Keyword
      // -------------------------------------------------------

      const keyword =
        (ev.keyword && ev.keyword !== "TBA")
          ? ev.keyword
          : "";


      // -------------------------------------------------------
      // Date / time
      // -------------------------------------------------------

      const timeStr =
        formatDisplayTime(ev.note);

      const dateStr =
        formatDateShort(
          ev._day,
          ev._monthIndex
        );


      // -------------------------------------------------------
      // GEN links
      // Maximum 2
      // -------------------------------------------------------

      const gens =
        (
          Array.isArray(ev.generators)
            ? ev.generators
            : []
        )
        .filter(function (g) {

          return (
            g &&
            g.url &&
            g.url !== "#" &&
            g.url !== "event-today.html"
          );

        })
        .slice(0, 2);


      const genHtml =
        gens
          .map(function (g, i) {

            return (
              '<a href="' +
              g.url +
              '" target="_blank" rel="noopener noreferrer" class="ev-gen">' +
              (g.name || ("GEN " + (i + 1))) +
              "</a>"
            );

          })
          .join("");


      // -------------------------------------------------------
      // Tags
      // Keyword FIRST
      // Hashtag SECOND
      // -------------------------------------------------------

      let tagsHtml = "";


      if (keyword) {

        tagsHtml +=
          '<span class="ev-tag keyword">' +
          keyword +
          "</span>";

      }


      if (hashtag) {

        tagsHtml +=
          '<span class="ev-tag hashtag">' +
          hashtag +
          "</span>";

      }


      // -------------------------------------------------------
      // Complete card
      // -------------------------------------------------------

      return (

        '<div class="' + cls + '">' +


          // Badge + Hearts

          '<div class="ev-top">' +

            '<div class="ev-badge">' +

              badgeDot +

              '<span class="text-[11px] font-bold tracking-wide uppercase ' +
              badgeClass +
              '">' +

              badgeText +

              "</span>" +

            "</div>" +

            (
              heartsHtml
                ? (
                    '<div class="ev-hearts">' +
                    heartsHtml +
                    "</div>"
                  )
                : ""
            ) +

          "</div>" +


          // Event title

          '<p class="ev-title">' +
          (ev.title || "Event") +
          "</p>" +


          // Date / time

          '<div class="ev-meta">' +

            '<span class="inline-flex items-center gap-1">' +

              '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">' +
                '<rect x="3" y="4" width="18" height="18" rx="2"/>' +
                '<path d="M16 2v4M8 2v4M3 10h18"/>' +
              '</svg>' +

              dateStr +

            "</span>" +


            (
              timeStr
                ? (
                    '<span class="inline-flex items-center gap-1">' +

                      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">' +
                        '<circle cx="12" cy="12" r="9"/>' +
                        '<path d="M12 7v5l3 2"/>' +
                      '</svg>' +

                      timeStr +

                    "</span>"
                  )
                : ""
            ) +

          "</div>" +


          // Keyword + Hashtag

          (
            tagsHtml
              ? (
                  '<div class="ev-tags">' +
                  tagsHtml +
                  "</div>"
                )
              : ""
          ) +


          // GEN buttons

          (
            genHtml
              ? (
                  '<div class="ev-bottom">' +

                    '<div class="ev-gens">' +
                    genHtml +
                    "</div>" +

                  "</div>"
                )
              : ""
          ) +


        "</div>"

      );
    }


    // =========================================================
    // Main
    // =========================================================

    const container =
      document.getElementById(
        "events-stack"
      );


    if (!container) {
      return;
    }


    // =========================================================
    // Current time in Bangkok / UTC+7
    // =========================================================

    const now =
      new Date();

    const bkkOffsetMs =
      7 *
      60 *
      60 *
      1000;

    const utc =
      now.getTime() +
      now.getTimezoneOffset() *
      60000;

    const bkk =
      new Date(
        utc +
        bkkOffsetMs
      );


    const todayDay =
      bkk.getDate();

    const todayMonth =
      bkk.getMonth();

    const nowMinutes =
      bkk.getHours() * 60 +
      bkk.getMinutes();


    // =========================================================
    // Load data.json
    // =========================================================

    fetch(
      "data.json?t=" +
      Date.now()
    )

      .then(function (r) {

        return r.json();

      })


      .then(function (data) {

        const schedule =
          (
            data.introduce &&
            data.introduce.schedule
          ) || [];



        // -----------------------------------------------------
        // Find ALL events happening today
        // -----------------------------------------------------

        const allEvents = [];

schedule.forEach(
  function (monthBlock) {

    (
      monthBlock.items ||
      []
    ).forEach(
      function (item) {

        const parsed =
          parseDateLabel(
            item.date
          );

        if (!parsed) {
          return;
        }

        allEvents.push({

          title: item.title,

          note: item.note,

          location: item.location,

          hastag: item.hastag,

          keyword: item.keyword,

          for: item.for,

          generators:
            Array.isArray(item.generators)
              ? item.generators
              : [],

          _day:
            parsed.day,

          _monthIndex:
            parsed.monthIndex,

          _startMin:
            parseTimeToMinutes(
              item.note
            )

        });

      }
    );

  }
);
        const activeEvents = [];

allEvents.forEach(
  function (event) {

    if (event._startMin === null) {

      if (
        event._day === todayDay &&
        event._monthIndex === todayMonth
      ) {
        activeEvents.push(event);
      }

      return;
    }

    const eventStart =
      new Date(
        bkk.getFullYear(),
        event._monthIndex,
        event._day,
        Math.floor(event._startMin / 60),
        event._startMin % 60,
        0,
        0
      );

    const eventEnd =
      new Date(
        eventStart.getTime() +
        24 * 60 * 60 * 1000
      );

    if (
      bkk >= eventStart &&
      bkk < eventEnd
    ) {

      activeEvents.push(event);

    }

  }
);


        // -----------------------------------------------------
        // Sort today's events by start time
        // -----------------------------------------------------

        activeEvents.sort(
          function (a, b) {

            if (
              a._startMin === null &&
              b._startMin === null
            ) {
              return 0;
            }

            if (
              a._startMin === null
            ) {
              return 1;
            }

            if (
              b._startMin === null
            ) {
              return -1;
            }

            return (
              a._startMin -
              b._startMin
            );

          }
        );


        // -----------------------------------------------------
        // No events today
        // -----------------------------------------------------

        if (
  activeEvents.length === 0
        ) {

          container.innerHTML =

            '<div class="event-live upcoming opacity-70">' +

              '<p class="ev-title">' +
              "No events today" +
              "</p>" +

              '<div class="ev-meta">' +
              "Check the full schedule in Intro" +
              "</div>" +

              '<div class="ev-bottom">' +

                '<div></div>' +

                '<a href="introduce.html" class="ev-view upcoming">' +
                "Schedule →" +
                "</a>" +

              "</div>" +

            "</div>";

          return;
        }


        // -----------------------------------------------------
        // Show ALL events today
        // -----------------------------------------------------

        container.innerHTML =
          activeEvents
            .map(function (event) {

              const status =
  getStatus(
    event,
    bkk
  );

              return buildCard(
                event,
                status
              );

            })
            .join("");


      })


      // =======================================================
      // Error handling
      // =======================================================

      .catch(function (err) {

        console.warn(
          "Failed to load events:",
          err
        );


        container.innerHTML =

          '<div class="event-live upcoming">' +

            '<p class="ev-title">' +
            "Could not load events" +
            "</p>" +

            '<div class="ev-meta">' +
            "Please refresh the page" +
            "</div>" +

          "</div>";

      });

  })();
  </script>


  <script src="common.js"></script>

</body>
</html>
