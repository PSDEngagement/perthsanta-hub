  <script>
  (function () {

    const MONTHS = {
      jan: 0, feb: 1, mar: 2, apr: 3, may: 4, jun: 5,
      jul: 6, aug: 7, sep: 8, oct: 9, nov: 10, dec: 11
    };

    function parseDateLabel(label) {
      if (!label) return null;
      const m = String(label).trim().match(/^(\d{1,2})\s+([A-Za-z]{3})/);
      if (!m) return null;
      const day = parseInt(m[1], 10);
      const monthIndex = MONTHS[m[2].toLowerCase()];
      if (monthIndex === undefined) return null;
      return { day, monthIndex };
    }

    function parseTimeToMinutes(note) {
      if (!note) return null;
      const s = String(note).trim().toUpperCase();
      if (s === "ALL DAY" || s === "TBA" || s === "N/A") return null;

      let m = s.match(/(\d{1,2})[:.](\d{2})\s*(AM|PM)/);
      if (m) {
        let h = parseInt(m[1], 10);
        const min = parseInt(m[2], 10);
        const ap = m[3];
        if (ap === "PM" && h < 12) h += 12;
        if (ap === "AM" && h === 12) h = 0;
        return h * 60 + min;
      }

      m = s.match(/(\d{1,2})[:.](\d{2})/);
      if (m) return parseInt(m[1], 10) * 60 + parseInt(m[2], 10);
      return null;
    }

    function formatDisplayTime(note) {
      if (!note) return "";
      const s = String(note).trim();
      if (/ALL DAY/i.test(s)) return "ALL DAY";
      if (/TBA/i.test(s)) return "TBA";
      return s.replace(/\s*\([^)]*\)\s*/g, "").trim() + " BKK";
    }

    function formatDateShort(day, monthIndex) {
      const names = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
      return String(day).padStart(2, "0") + " " + names[monthIndex];
    }

    function getBkkNow() {
      const now = new Date();
      const utc = now.getTime() + now.getTimezoneOffset() * 60000;
      return new Date(utc + 7 * 60 * 60 * 1000);
    }

    function getStatus(event, nowDate) {
      const start = event._startMin === null
        ? new Date(nowDate.getFullYear(), event._monthIndex, event._day, 0, 0, 0, 0)
        : new Date(
            nowDate.getFullYear(),
            event._monthIndex,
            event._day,
            Math.floor(event._startMin / 60),
            event._startMin % 60,
            0,
            0
          );
      const eventEnd = new Date(start.getTime() + 24 * 60 * 60 * 1000);
      if (nowDate < start) return "upcoming";
      if (nowDate >= eventEnd) return "past";
      return "live";
    }

    function statusRank(status) {
      if (status === "live") return 0;
      if (status === "upcoming") return 1;
      return 2;
    }

    function getAudienceHearts(audience) {
      const values = Array.isArray(audience)
        ? audience.map(function (item) {
            return String(item || "").trim().toUpperCase();
          })
        : [String(audience || "").trim().toUpperCase()];

      const hearts = [];

      if (values.includes("PERTH") || values.includes("PS") || values.includes("PERTHSANTA") || values.includes("PSD")) {
        hearts.push('<span class="heart-black" aria-label="Perth">♥</span>');
      }
      if (values.includes("SANTA") || values.includes("PS") || values.includes("PERTHSANTA") || values.includes("PSD")) {
        hearts.push('<span class="heart-white" aria-label="Santa">♥</span>');
      }
      if (values.includes("PSD")) {
        hearts.push('<span class="heart-red" aria-label="Domiia">♥</span>');
      }

      return hearts.join("");
    }

    function buildCard(ev, status) {
      const isLive = status === "live";
      const isPast = status === "past";
      const cls = "event-live" + (isLive ? "" : " upcoming") + (isPast ? " opacity-60" : "");

      let badgeHtml;

      if (isLive) {
        badgeHtml =
          '<span class="live-dot"></span>' +
          '<span class="text-[11px] font-bold tracking-wide uppercase live-text">LIVE NOW</span>';
      } else if (!isPast) {
        badgeHtml =
          '<span class="text-[11px] font-bold tracking-wide uppercase upcoming-text">UPCOMING</span>' +
          '<span class="upcoming-dots" aria-hidden="true"><span>.</span><span>.</span><span>.</span></span>';
      } else {
        badgeHtml =
          '<span class="ended-dot"></span>' +
          '<span class="text-[11px] font-bold tracking-wide uppercase text-zinc-400">ENDED</span>';
      }

      const heartsHtml = getAudienceHearts(ev.for);
      const hashtag = (ev.hastag && ev.hastag !== "TBA") ? "#" + ev.hastag.replace(/^#/, "") : "";
      const keyword = (ev.keyword && ev.keyword !== "TBA") ? ev.keyword : "";
      const timeStr = formatDisplayTime(ev.note);
      const dateStr = formatDateShort(ev._day, ev._monthIndex);

      // Start Trend: ưu tiên field tự điền, không có thì tự trừ 15 phút
      let startTrendStr = "";
      if (ev.startTrend) {
        startTrendStr = formatDisplayTime(ev.startTrend);
      } else if (ev._startMin !== null) {
        let trendMin = ev._startMin - 15;
        if (trendMin < 0) trendMin += 24 * 60;
        let h = Math.floor(trendMin / 60);
        let m = trendMin % 60;
        const ap = h >= 12 ? "PM" : "AM";
        let h12 = h % 12;
        if (h12 === 0) h12 = 12;
        startTrendStr = String(h12).padStart(2, "0") + ":" + String(m).padStart(2, "0") + " " + ap + " BKK";
      }

      const gens = (Array.isArray(ev.generators) ? ev.generators : [])
        .filter(function (g) {
          return g && g.url && g.url !== "#" && g.url !== "event-today.html";
        })
        .slice(0, 3);

      const genHtml = gens.map(function (g, i) {
        return '<a href="' + g.url + '" target="_blank" rel="noopener noreferrer" class="ev-gen">' +
          (g.name || ("GEN " + (i + 1))) + "</a>";
      }).join("");

      let tagsHtml = "";
      if (keyword) tagsHtml += '<span class="ev-tag keyword">' + keyword + "</span>";
      if (hashtag) tagsHtml += '<span class="ev-tag hashtag">' + hashtag + "</span>";

      return '<div class="' + cls + '">' +
        '<div class="ev-top">' +
          '<div class="ev-badge">' + badgeHtml + "</div>" +
          (heartsHtml ? '<div class="ev-hearts">' + heartsHtml + "</div>" : "") +
        "</div>" +
        '<p class="ev-title">' + (ev.title || "Event") + "</p>" +
        '<div class="ev-meta">' +
          '<span class="inline-flex items-center gap-1">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">' +
              '<rect x="3" y="4" width="18" height="18" rx="2"/>' +
              '<path d="M16 2v4M8 2v4M3 10h18"/>' +
            "</svg>" +
            dateStr +
          "</span>" +
          (timeStr
            ? '<span class="inline-flex items-center gap-1">' +
                '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">' +
                  '<circle cx="12" cy="12" r="9"/>' +
                  '<path d="M12 7v5l3 2"/>' +
                "</svg>" +
                timeStr +
              "</span>"
            : "") +
          (startTrendStr
            ? '<span class="inline-flex items-center gap-1 text-red-400">' +
                '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">' +
                  '<circle cx="12" cy="12" r="9"/>' +
                  '<path d="M12 7v5l3 2"/>' +
                "</svg>" +
                "Start Trend " + startTrendStr +
              "</span>"
            : "") +
        "</div>" +
        (tagsHtml ? '<div class="ev-tags">' + tagsHtml + "</div>" : "") +
        (genHtml ? '<div class="ev-bottom"><div class="ev-gens">' + genHtml + "</div></div>" : "") +
      "</div>";
    }

    const container = document.getElementById("events-stack");
    if (!container) return;

    let scheduleCache = [];

    function renderHomeEvents() {
      const bkk = getBkkNow();
      const allEvents = [];

      scheduleCache.forEach(function (monthBlock) {
        (monthBlock.items || []).forEach(function (item) {
          const parsed = parseDateLabel(item.date);
          if (!parsed) return;

          allEvents.push({
            title: item.title,
            note: item.note,
            startTrend: item.startTrend || null,
            location: item.location,
            hastag: item.hastag,
            keyword: item.keyword,
            for: item.for,
            generators: Array.isArray(item.generators) ? item.generators : [],
            _day: parsed.day,
            _monthIndex: parsed.monthIndex,
            _startMin: parseTimeToMinutes(item.note)
          });
        });
      });

      const activeEvents = [];

      allEvents.forEach(function (event) {
        const showStart = new Date(bkk.getFullYear(), event._monthIndex, event._day, 0, 0, 0, 0);
        const hideAt = new Date(bkk.getFullYear(), event._monthIndex, event._day + 2, 0, 0, 0, 0);
        if (bkk >= showStart && bkk < hideAt) activeEvents.push(event);
      });

      activeEvents.sort(function (a, b) {
        const rankA = statusRank(getStatus(a, bkk));
        const rankB = statusRank(getStatus(b, bkk));
        if (rankA !== rankB) return rankA - rankB;

        if (a._startMin === null && b._startMin === null) return 0;
        if (a._startMin === null) return 1;
        if (b._startMin === null) return -1;
        return a._startMin - b._startMin;
      });

      const mobileSupport = document.getElementById("mobile-home-support");
      const homeTasks = document.getElementById("home-tasks");
      const desktopEmptyState = document.getElementById("desktop-empty-state");

      if (mobileSupport) mobileSupport.classList.remove("show");
      if (desktopEmptyState) desktopEmptyState.classList.remove("show");
      if (homeTasks) homeTasks.classList.remove("mobile-show");

      if (mobileSupport && activeEvents.length === 0) mobileSupport.classList.add("show");
      if (desktopEmptyState && activeEvents.length === 0) desktopEmptyState.classList.add("show");
      if (homeTasks && activeEvents.length <= 1) homeTasks.classList.add("mobile-show");

      container.innerHTML = activeEvents.map(function (event) {
        return buildCard(event, getStatus(event, bkk));
      }).join("");
    }

    fetch("data.json?t=" + Date.now())
      .then(function (r) { return r.json(); })
      .then(function (data) {
        scheduleCache = (data.introduce && data.introduce.schedule) || [];
        renderHomeEvents();
        setInterval(renderHomeEvents, 30000);
      })
      .catch(function (err) {
        console.warn("Failed to load events:", err);
        container.innerHTML =
          '<div class="event-live upcoming">' +
            '<p class="ev-title">Could not load events</p>' +
            '<div class="ev-meta">Please refresh the page</div>' +
          "</div>";
      });

  })();
  </script>
