<!DOCTYPE html>
<html lang="en">
<head>

  >

  <meta property="og:title" content="PerthSanta Engagement Hub">
  <meta
    property="og:description"
    content="Support PerthSanta through events, missions, streaming and social engagement."
  >

    property="og:url"
    content="https://psdengagement.github.io/perthsanta-hub/"
  >
  <meta
    property="og:image"

  >

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="PerthSanta Engagement Hub">
  <meta
    name="twitter:description"
    content="Support PerthSanta through events, missions, streaming and social engagement."
  >
  <meta
    name="twitter:image"
    content="https://psdengagement.github.io/perthsanta-hub/images/hero-perthsanta.jpg"
  >

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Inter", sans-serif;
      background: #050505;
      color: #ffffff;
    }

    a {
      text-decoration: none;
    }

    /* =========================
       HERO
    ========================= */

    .hero {
      position: relative;
      min-height: 430px;
      display: flex;
      align-items: flex-end;
      overflow: hidden;
      background: #090909;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(
          to top,
          rgba(0,0,0,.92) 0%,
          rgba(0,0,0,.48) 48%,
          rgba(0,0,0,.05) 100%
        ),
        url("images/hero-perthsanta.jpg") center / cover no-repeat;
    }

    .hero-content {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 3rem 1.25rem 2.5rem;
    }

    .hero-title {
      margin: 0;
      font-size: clamp(2.5rem, 6vw, 5rem);
      line-height: .95;
      font-weight: 800;
      letter-spacing: -0.06em;
    }

    .hero-subtitle {
      margin-top: .8rem;
      color: rgba(255,255,255,.72);
      font-size: .9rem;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    /* =========================
       MAIN
    ========================= */

    .main {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem 1.25rem 4rem;
    }

    /* =========================
       EVENT STACK
    ========================= */

    .events-stack {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    /* Desktop: 2 cards side-by-side */
    @media (min-width: 768px) {
      .events-stack {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    /* =========================
       EVENT CARD
    ========================= */

    .event-card {
      position: relative;
      width: 100%;
      min-width: 0;
      padding: 1.15rem;
      border: 1px solid rgba(255,255,255,.09);
      border-radius: 1.25rem;
      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.045),
          rgba(255,255,255,.015)
        );
      box-shadow:
        0 12px 35px rgba(0,0,0,.28);
      overflow: hidden;
    }

    .event-card::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      width: 3px;
      height: 100%;
      background: #dc2626;
      opacity: .8;
    }

    .ev-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .75rem;
      min-width: 0;
    }

    .ev-badge {
      display: inline-flex;
      align-items: center;
      gap: .35rem;
      min-width: 0;
      font-size: .68rem;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: rgba(255,255,255,.72);
    }

    .event-live {
      color: #ef4444;
    }

    .live-dot {
      width: .42rem;
      height: .42rem;
      border-radius: 999px;
      background: #ef4444;
      flex-shrink: 0;
      animation: live-flash .7s ease-in-out infinite;
    }

    .live-text {
      animation: live-flash .7s ease-in-out infinite;
    }

    @keyframes live-flash {
      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: .25;
      }
    }

    /* =========================
       AUDIENCE HEARTS
    ========================= */

    .ev-hearts {
      display: inline-flex;
      align-items: center;
      justify-content: flex-end;
      gap: .18rem;
      margin-left: auto;
      flex-shrink: 0;
    }

    .ev-heart {
      display: inline-block;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 1.28rem;
      line-height: 1;
      font-weight: 900;
    }

    .ev-heart.black {
      color: #000000;
      -webkit-text-stroke: 1px rgba(255,255,255,.75);
      text-shadow: 0 0 1px rgba(255,255,255,.7);
    }

    .ev-heart.white {
      color: #ffffff;
      -webkit-text-stroke: .25px rgba(255,255,255,.4);
    }

    .ev-heart.red {
      color: #ef4444;
    }

    /* =========================
       EVENT CONTENT
    ========================= */

    .ev-title {
      margin-top: .8rem;
      font-size: 1rem;
      line-height: 1.35;
      font-weight: 800;
      color: #ffffff;
    }

    .ev-meta {
      display: flex;
      flex-wrap: wrap;
      gap: .4rem .65rem;
      margin-top: .5rem;
      color: rgba(255,255,255,.58);
      font-size: .72rem;
      line-height: 1.4;
    }

    .ev-meta-item {
      display: inline-flex;
      align-items: center;
    }

    .ev-location {
      margin-top: .35rem;
      color: rgba(255,255,255,.48);
      font-size: .7rem;
      line-height: 1.4;
    }

    .ev-tags {
      display: flex;
      flex-wrap: wrap;
      gap: .4rem;
      margin-top: .8rem;
    }

    .ev-tag {
      display: inline-flex;
      align-items: center;
      min-height: 1.55rem;
      padding: .25rem .55rem;
      border-radius: .45rem;
      font-size: .65rem;
      line-height: 1.2;
      font-weight: 600;
      word-break: break-word;
    }

    .ev-tag.keyword {
      color: rgba(255,255,255,.65);
      background: rgba(255,255,255,.055);
      border: 1px solid rgba(255,255,255,.07);
    }

    .ev-tag.hashtag {
      color: #ffffff;
      background: rgba(255,255,255,.09);
      border: 1px solid rgba(255,255,255,.12);
    }

    /* =========================
       GENERATORS
    ========================= */

    .ev-generators {
      display: flex;
      flex-wrap: wrap;
      gap: .5rem;
      margin-top: 1rem;
    }

    .ev-gen {
      width: 2.75rem;
      height: 2.75rem;
      min-width: 2.75rem;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;

      border-radius: .65rem;
      border: 1px solid rgba(255,255,255,.14);

      background: rgba(255,255,255,.06);
      color: #ffffff;

      font-size: .68rem;
      line-height: 1;
      font-weight: 700;

      transition:
        background .2s ease,
        border-color .2s ease,
        transform .2s ease;
    }

    .ev-gen:hover {
      background: rgba(220,38,38,.16);
      border-color: rgba(239,68,68,.45);
      transform: translateY(-1px);
    }

    /* =========================
       TASKS
    ========================= */

    .tasks-grid {
      display: none;
    }

    @media (min-width: 640px) {
      .tasks-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 1rem;
      }
    }

    @media (min-width: 1024px) {
      .tasks-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
    }

    .task-card {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 170px;
      padding: 1.15rem;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 1rem;
      background: rgba(255,255,255,.025);
      transition:
        transform .2s ease,
        border-color .2s ease;
    }

    .task-card:hover {
      transform: translateY(-2px);
      border-color: rgba(255,255,255,.16);
    }

    .task-number {
      color: #ef4444;
      font-size: .65rem;
      font-weight: 700;
      letter-spacing: .12em;
    }

    .task-title {
      margin-top: .7rem;
      font-size: .95rem;
      font-weight: 700;
      line-height: 1.35;
    }

    .task-link {
      margin-top: 1.25rem;
      color: rgba(255,255,255,.58);
      font-size: .68rem;
      font-weight: 600;
    }

    /* =========================
       EMPTY STATE
    ========================= */

    .empty-events {
      padding: 1.5rem;
      border: 1px dashed rgba(255,255,255,.1);
      border-radius: 1rem;
      color: rgba(255,255,255,.45);
      text-align: center;
      font-size: .8rem;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 639px) {
      .hero {
        min-height: 360px;
      }

      .hero-content {
        padding: 2rem 1rem 2rem;
      }

      .main {
        padding: 1.25rem 1rem 3rem;
      }

      .event-card {
        padding: 1rem;
      }

      .ev-heart {
        font-size: 1.22rem;
      }

      .ev-gen {
        width: 2.75rem;
        height: 2.75rem;
        min-width: 2.75rem;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       EVENT SCRIPT
  ========================= -->

  <script>
    const MONTHS = {
      January: 0,
      February: 1,
      March: 2,
      April: 3,
      May: 4,
      June: 5,
      July: 6,
      August: 7,
      September: 8,
      October: 9,
      November: 10,
      December: 11
    };


    /* =========================
       DATE PARSER
    ========================= */

    function parseDateLabel(label) {
      const parts = String(label || "")
        .trim()
        .split(/\s+/);

      if (parts.length < 2) {
        return null;
      }

      const day = parseInt(parts[0], 10);
      const monthIndex = MONTHS[parts[1]];

      if (!Number.isFinite(day) || monthIndex === undefined) {
        return null;
      }

      return {
        day: day,
        monthIndex: monthIndex
      };
    }


    /* =========================
       TIME PARSER
    ========================= */

    function parseTimeToMinutes(note) {
      const text = String(note || "")
        .replace(/\(UTC\+7\)/gi, "")
        .trim()
        .toUpperCase();

      if (text.includes("ALL DAY")) {
        return 0;
      }

      if (text.includes("TBA")) {
        return 0;
      }

      const match = text.match(
        /(\d{1,2})(?::(\d{2}))?\s*(AM|PM)?/
      );

      if (!match) {
        return 0;
      }

      let hour = parseInt(match[1], 10);
      const minute = parseInt(match[2] || "0", 10);
      const ampm = match[3];

      if (ampm === "PM" && hour !== 12) {
        hour += 12;
      }

      if (ampm === "AM" && hour === 12) {
        hour = 0;
      }

      return hour * 60 + minute;
    }


    /* =========================
       DISPLAY TIME
    ========================= */

    function formatDisplayTime(note) {
      const text = String(note || "")
        .replace(/\(UTC\+7\)/gi, "")
        .trim();

      if (!text) {
        return "BKK";
      }

      return text + " BKK";
    }


    /* =========================
       DISPLAY DATE
    ========================= */

    function formatDateShort(day, monthIndex) {
      const monthNames = [
        "JAN",
        "FEB",
        "MAR",
        "APR",
        "MAY",
        "JUN",
        "JUL",
        "AUG",
        "SEP",
        "OCT",
        "NOV",
        "DEC"
      ];

      return (
        String(day).padStart(2, "0") +
        " " +
        monthNames[monthIndex]
      );
    }


    /* =========================
       EVENT STATUS
    ========================= */

    function getStatus(startMinutes, nowMinutes, note) {
      const text = String(note || "").toUpperCase();

      if (
        text.includes("ALL DAY") ||
        text.includes("TBA")
      ) {
        return "live";
      }

      if (nowMinutes < startMinutes) {
        return "upcoming";
      }

      return "live";
    }


    /* =========================
       AUDIENCE HEARTS
    ========================= */

    function getAudienceHearts(audience) {
      const list = Array.isArray(audience)
        ? audience
        : [audience];

      const normalized = list.map(function (item) {
        return String(item || "")
          .trim()
          .toUpperCase();
      });

      const hearts = [];

      /*
        PERTH → black
        SANTA → white
        PS    → black + white
        PSD   → black + white + red
      */

      if (
        normalized.includes("PERTH") ||
        normalized.includes("PS") ||
        normalized.includes("PSD")
      ) {
        hearts.push(
          '<span class="ev-heart black" aria-label="Perth">♥</span>'
        );
      }

      if (
        normalized.includes("SANTA") ||
        normalized.includes("PS") ||
        normalized.includes("PSD")
      ) {
        hearts.push(
          '<span class="ev-heart white" aria-label="Santa">♥</span>'
        );
      }

      if (normalized.includes("PSD")) {
        hearts.push(
          '<span class="ev-heart red" aria-label="Domiia">♥</span>'
        );
      }

      return hearts.join("");
    }


    /* =========================
       BUILD EVENT CARD
    ========================= */

    function buildCard(ev, status) {

      const audienceHearts = getAudienceHearts(ev.for);

      const gens =
        (Array.isArray(ev.generators)
          ? ev.generators
          : []
        )
          .filter(function (g) {
            return (
              g &&
              g.url &&
              g.url !== "#" &&
              g.url !== "event-today.html"
            );
          })
          .slice(0, 2);


      const generatorHtml = gens.length
        ? `
          <div class="ev-generators">
            ${gens.map(function (g) {
              return `
                <a
                  class="ev-gen"
                  href="${g.url}"
                  target="_blank"
                  rel="noopener noreferrer"
                  aria-label="${g.name || "Generator"}"
                >
                  GEN
                </a>
              `;
            }).join("")}
          </div>
        `
        : "";


      const badgeHtml =
        status === "live"
          ? `
            <div class="ev-badge event-live">
              <span class="live-dot"></span>
              <span class="live-text">LIVE NOW</span>
            </div>
          `
          : `
            <div class="ev-badge">
              UPCOMING
            </div>
          `;


      const dateInfo = parseDateLabel(ev.date);

      const displayDate = dateInfo
        ? formatDateShort(
            dateInfo.day,
            dateInfo.monthIndex
          )
        : "";


      return `
        <article class="event-card">

          <div class="ev-top">

            ${badgeHtml}

            ${
              audienceHearts
                ? `
                  <div class="ev-hearts">
                    ${audienceHearts}
                  </div>
                `
                : ""
            }

          </div>


          <div class="ev-title">
            ${ev.title || ""}
          </div>


          <div class="ev-meta">

            ${
              displayDate
                ? `
                  <span class="ev-meta-item">
                    ${displayDate}
                  </span>
                `
                : ""
            }

            <span class="ev-meta-item">
              ${formatDisplayTime(ev.note)}
            </span>

          </div>


          ${
            ev.location
              ? `
                <div class="ev-location">
                  ${ev.location}
                </div>
              `
              : ""
          }


          <div class="ev-tags">

            ${
              ev.keyword
                ? `
                  <span class="ev-tag keyword">
                    ${ev.keyword}
                  </span>
                `
                : ""
            }

            ${
              ev.hastag
                ? `
                  <span class="ev-tag hashtag">
                    #${ev.hastag}
                  </span>
                `
                : ""
            }

          </div>


          ${generatorHtml}

        </article>
      `;
    }


    /* =========================
       LOAD EVENTS
    ========================= */

    async function loadEvents() {

      const container =
        document.getElementById("events-stack");

      if (!container) {
        return;
      }


      try {

        const response = await fetch(
          "data.json?t=" + Date.now(),
          {
            cache: "no-store"
          }
        );


        if (!response.ok) {
          throw new Error(
            "Failed to load data.json"
          );
        }


        const data = await response.json();


        const schedule =
          data &&
          data.introduce &&
          Array.isArray(data.introduce.schedule)
            ? data.introduce.schedule
            : [];


        /*
          Bangkok time (UTC+7)
        */

        const now = new Date();

        const bkkDate = new Date(
          now.toLocaleString(
            "en-US",
            {
              timeZone: "Asia/Bangkok"
            }
          )
        );


        const currentDay =
          bkkDate.getDate();

        const currentMonth =
          bkkDate.getMonth();

        const currentYear =
          bkkDate.getFullYear();


        const nowMinutes =
          bkkDate.getHours() * 60 +
          bkkDate.getMinutes();


        const todayEvents = [];


        schedule.forEach(function (monthBlock) {

          const monthName =
            String(
              monthBlock.month || ""
            )
            .trim()
            .split(/\s+/)[0];


          const monthIndex =
            MONTHS[monthName];


          if (
            monthIndex === undefined
          ) {
            return;
          }


          const items =
            Array.isArray(monthBlock.items)
              ? monthBlock.items
              : [];


          items.forEach(function (item) {

            const dateInfo =
              parseDateLabel(item.date);


            if (!dateInfo) {
              return;
            }


            if (
              dateInfo.day !== currentDay ||
              dateInfo.monthIndex !== currentMonth
            ) {
              return;
            }


            const startMinutes =
              parseTimeToMinutes(
                item.note
              );


            const status =
              getStatus(
                startMinutes,
                nowMinutes,
                item.note
              );


            todayEvents.push({
              ...item,
              startMinutes,
              status
            });

          });

        });


        /*
          Sort all events of today
          by start time.
        */

        todayEvents.sort(function (a, b) {
          return (
            a.startMinutes -
            b.startMinutes
          );
        });


        if (!todayEvents.length) {

          container.innerHTML = `
            <div class="empty-events">
              No events today.
            </div>
          `;

          return;
        }


        container.innerHTML =
          todayEvents
            .map(function (event) {
              return buildCard(
                event,
                event.status
              );
            })
            .join("");


      } catch (error) {

        console.error(
          "Event loading error:",
          error
        );

        container.innerHTML = `
          <div class="empty-events">
            Unable to load today's events.
          </div>
        `;
      }

    }


    loadEvents();


    /*
      Refresh event status every minute.
      This keeps LIVE / UPCOMING status current.
    */

    setInterval(
      loadEvents,
      60000
    );

  </script>


  <script src="common.js"></script>

</body>
