<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PerthSanta Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background: linear-gradient(to bottom, #1a0b2e, #2d1b4e);
      min-height: 100vh;
    }
  </style>
</head>
<body class="text-white">

  <!-- Header -->
  <div class="text-center pt-16 pb-10">
    <h1 class="text-4xl md:text-5xl font-bold mb-3">Welcome to PerthSanta Hub</h1>
    <p class="text-lg text-purple-200">Together. Forever. Domiia.</p>
  </div>

  <!-- Cards -->
  <div class="max-w-6xl mx-auto px-4 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 pb-20">

    <!-- Card 1 -->
    <div class="bg-purple-900/60 border border-purple-500 rounded-2xl p-6 hover:scale-105 transition">
      <p class="text-sm text-purple-300 mb-2">01</p>
      <h2 class="text-xl font-bold mb-2">Community Center</h2>
      <p class="text-sm text-gray-300 mb-4">Fan votes, discussions & moments</p>
      <button class="bg-purple-600 hover:bg-purple-500 px-4 py-2 rounded-full text-sm">
        Open Community →
      </button>
    </div>

    <!-- Card 2 -->
    <div class="bg-pink-900/60 border border-pink-500 rounded-2xl p-6 hover:scale-105 transition">
      <p class="text-sm text-pink-300 mb-2">02</p>
      <h2 class="text-xl font-bold mb-2">Campaign Center</h2>
      <p class="text-sm text-gray-300 mb-4">Streaming & rating missions</p>
      <button class="bg-pink-600 hover:bg-pink-500 px-4 py-2 rounded-full text-sm">
        Open Campaigns →
      </button>
    </div>

    <!-- Card 3 -->
    <div class="bg-red-900/60 border border-red-500 rounded-2xl p-6 hover:scale-105 transition">
      <p class="text-sm text-red-300 mb-2">03</p>
      <h2 class="text-xl font-bold mb-2">Live Tracker</h2>
      <p class="text-sm text-gray-300 mb-4">YouTube views & chart tracking</p>
      <button class="bg-red-600 hover:bg-red-500 px-4 py-2 rounded-full text-sm">
        Open Tracker →
      </button>
    </div>

  </div>

  <footer class="text-center text-sm text-gray-400 pb-8">
    © 2026 PerthSanta Hub · Made with love by fans
  </footer>

</body>
</html>
