<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Heartbound Series Trends - PerthSanta Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #0a0a0a;
      min-height: 100vh;
    }
    .card {
      transition: all 0.25s ease;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 25px rgba(220, 38, 38, 0.25);
    }
  </style>
</head>
<body class="text-white">

  <!-- Header -->
  <div class="max-w-4xl mx-auto px-4 pt-10 pb-6">
    <a href="index.html" class="text-red-500 hover:text-red-400 text-sm mb-6 inline-block">
      ← Back to Home
    </a>
    <h1 class="text-3xl md:text-4xl font-bold mb-2">Heartbound Series Trends</h1>
    <p class="text-gray-400">Select an episode to view generators</p>
  </div>

  <!-- Episode List -->
  <div id="episode-list" class="max-w-4xl mx-auto px-4 grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4 pb-16">
    <!-- Các nút Ep sẽ được tạo bằng JavaScript -->
  </div>

  <!-- Generators Section -->
  <div id="generators-section" class="hidden max-w-4xl mx-auto px-4 pb-20">
    <div class="flex items-center justify-between mb-6">
      <h2 class="text-2xl font-bold">
        Episode <span id="current-ep">1</span> – Generators
      </h2>
      <button onclick="backToEpisodes()" class="text-sm text-red-500 hover:text-red-400">
        ← Back to Episodes
      </button>
    </div>

    <div id="generators-list" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <!-- Generators sẽ được tạo bằng JavaScript -->
    </div>
  </div>

  <script>
    let data = {};

    // Load data from data.json
    fetch('data.json')
      .then(response => response.json())
      .then(json => {
        data = json;
        renderEpisodes();
      })
      .catch(err => {
        console.error("Error loading data.json", err);
        document.getElementById("episode-list").innerHTML = "<p class='text-red-500'>Error loading data</p>";
      });

    function renderEpisodes() {
      const container = document.getElementById("episode-list");
      container.innerHTML = "";

      // Lấy danh sách episode từ data
      const episodes = Object.keys(data.episodes || {}).sort((a, b) => a - b);

      episodes.forEach(ep => {
        const btn = document.createElement("button");
        btn.className = "card bg-zinc-900 border border-zinc-700 rounded-xl p-5 text-center hover:border-red-500";
        btn.innerHTML = `
          <p class="text-red-500 text-sm mb-1">EP</p>
          <p class="text-2xl font-bold">${ep}</p>
        `;
        btn.onclick = () => showGenerators(ep);
        container.appendChild(btn);
      });
    }

    function showGenerators(epNumber) {
      document.getElementById("episode-list").classList.add("hidden");
      document.getElementById("generators-section").classList.remove("hidden");
      document.getElementById("current-ep").innerText = epNumber;

      const generators = data.episodes[epNumber] || [];
      const container = document.getElementById("generators-list");
      container.innerHTML = "";

      generators.forEach(gen => {
        const a = document.createElement("a");
        a.href = gen.url;
        a.target = "_blank";
        a.className = "card bg-zinc-900 border border-zinc-700 rounded-xl p-5 hover:border-red-500 block";
        a.innerHTML = `
          <p class="text-red-500 text-sm mb-1">${gen.name}</p>
          <p class="font-medium">${gen.title}</p>
          <p class="text-xs text-gray-500 mt-2">Click to open →</p>
        `;
        container.appendChild(a);
      });
    }

    function backToEpisodes() {
      document.getElementById("generators-section").classList.add("hidden");
      document.getElementById("episode-list").classList.remove("hidden");
    }
  </script>

</body>
</html>
