<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Heartbound Series Trends - PerthSanta Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #070707; min-height: 100vh; }
    .card { transition: all 0.25s ease; }
    .card:hover { transform: translateY(-4px); box-shadow: 0 10px 25px rgba(185, 28, 28, 0.25); }
  </style>
</head>
<body class="text-white">
  <div class="max-w-4xl mx-auto px-4 pt-8 pb-6">
    <h1 class="text-3xl md:text-4xl font-bold mb-2">Heartbound Series Trends</h1>
    <p class="text-gray-400">Select an episode to view generators</p>
  </div>

  <div id="episode-list" class="max-w-4xl mx-auto px-4 grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4 mb-10"></div>

  <div id="generators-section" class="hidden max-w-4xl mx-auto px-4 pb-10">

      <h2 class="text-2xl font-bold">Episode <span id="current-ep">1</span> – Generators</h2>
      <button onclick="backToEpisodes()" class="text-sm text-red-500 hover:text-red-400">← Back to Episodes</button>
    </div>
    <div id="generators-list" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
  </div>

  <section class="max-w-4xl mx-auto px-4 pb-20">

          <img src="https://cdn.simpleicons.org/x/ffffff" alt="X" class="w-7 h-7">
        </div>
        <p class="text-lg font-bold">X</p>
      </button>

      <button type="button" onclick="showGuide('instagram')" class="card bg-zinc-900 border border-zinc-700 rounded-2xl p-5 text-center min-h-[140px]">
        <div class="w-12 h-12 mx-auto mb-3 rounded-xl bg-zinc-800 flex items-center justify-center">
          <img src="https://cdn.simpleicons.org/instagram/E4405F" alt="Instagram" class="w-7 h-7">
        </div>
        <p class="text-lg font-bold">Instagram</p>
      </button>

      <button type="button" onclick="showGuide('tiktok')" class="card bg-zinc-900 border border-zinc-700 rounded-2xl p-5 text-center min-h-[140px]">
        <div class="w-12 h-12 mx-auto mb-3 rounded-xl bg-zinc-800 flex items-center justify-center">
          <img src="https://cdn.simpleicons.org/tiktok/ffffff" alt="TikTok" class="w-7 h-7">
        </div>
        <p class="text-lg font-bold">TikTok</p>
      </button>

      <button type="button" onclick="showGuide('facebook')" class="card bg-zinc-900 border border-zinc-700 rounded-2xl p-5 text-center min-h-[140px]">
        <div class="w-12 h-12 mx-auto mb-3 rounded-xl bg-zinc-800 flex items-center justify-center">
          <img src="https://cdn.simpleicons.org/facebook/1877F2" alt="Facebook" class="w-7 h-7">
        </div>
        <p class="text-lg font-bold">Facebook</p>
      </button>

      <button type="button" onclick="showGuide('youtube')" class="card bg-zinc-900 border border-zinc-700 rounded-2xl p-5 text-center min-h-[140px]">
        <div class="w-12 h-12 mx-auto mb-3 rounded-xl bg-zinc-800 flex items-center justify-center">
          <img src="https://cdn.simpleicons.org/youtube/FF0000" alt="YouTube" class="w-7 h-7">
        </div>
        <p class="text-lg font-bold">YouTube</p>
      </button>
    </div>

    <div id="guide-detail" class="hidden">
      <div class="flex items-center justify-between mb-4 gap-3">
        <h3 id="guide-detail-title" class="text-2xl font-bold">Guide</h3>
        <button onclick="backToGuides()" class="text-sm text-red-500 hover:text-red-400">← Back to platforms</button>
      </div>
