<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Today - PerthSanta Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body { background: #070707; min-height: 100vh; }
    body { font-family: Inter, system-ui, sans-serif; color: #fff; }
    .title-serif { font-family: "Cormorant Garamond", Georgia, serif; }

    /* Card 4:5 (800×1000) */
    .event-card {
      position: relative;
      width: 100%;
      max-width: 800px;
      aspect-ratio: 4 / 5;
      border-radius: 1rem;
      overflow: hidden;
      border: 1px solid #3f3f46;
      background: #141414;
    }

    /* Ảnh nền mờ / chìm */
    .event-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: url("images/piceventtoday.jpg") center / cover no-repeat;
      opacity: 0.22;
      filter: blur(1.5px) brightness(0.7);
      z-index: 0;
    }

    /* Overlay tối nhẹ để chữ rõ hơn */
    .event-card::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(7,7,7,0.35) 0%, rgba(7,7,7,0.55) 40%, rgba(7,7,7,0.75) 100%);
      z-index: 1;
    }

    .event-content {
      position: relative;
      z-index: 2;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 1.75rem 1.5rem 1.5rem;
    }

    @media (min-width: 640px) {
      .event-content { padding: 2.25rem 2rem 1.75rem; }
    }

    /* Gen buttons – góc dưới phải, xếp dọc */
    .gen-stack {
      position: absolute;
      bottom: 1.25rem;
      right: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      z-index: 3;
    }

    .gen-card {
      width: 3.25rem;
      height: 3.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, #2a0a0a 0%, #18181b 50%, #0c0c0c 100%);
      border: 1px solid #3f3f46;
      border-radius: 0.75rem;
      text-align: center;
      font-size: 0.65rem;
      font-weight: 600;
      color: #d4d4d8;
      transition: all 0.25s ease;
      text-decoration: none;
    }

    @media (min-width: 640px) {
      .gen-card { width: 3.75rem; height: 3.75rem; font-size: 0.75rem; }
    }

    .gen-card:hover {
      border-color: #ef4444;
      color: #fff;
      background: linear-gradient(145deg, #450a0a 0%, #1c0909 50%, #0c0c0c 100%);
      box-shadow: 0 0 14px rgba(239, 68, 68, 0.3);
      transform: translateY(-2px);
    }
  </style>
</head>
<body class="text-white">
  <div class="max-w-4xl mx-auto px-4 pt-10 pb-24">
    <a href="series-trends.html" class="inline-block text-sm text-red-400 hover:text-red-300 mb-6">← Back to Trends</a>

    <h1 class="title-serif text-4xl sm:text-5xl font-bold leading-none mb-2">
      Event <span class="text-red-500">Today</span>
    </h1>
    <p class="text-gray-400 text-sm mb-8">Live from the schedule. Updates automatically each day.</p>

    <!-- Event card 800×1000 (4:5) -->
    <div class="event-card mx-auto">
      <div class="event-content">
        <!-- Nội dung căn trái -->
        <div class="text-left pr-16 sm:pr-20">
          <p class="title-serif text-xl sm:text-2xl md:text-3xl font-bold text-white leading-snug tracking-wide">
            DR.ALLY PAI AEW TUAY KAN TEE CHANG MAI WITH PERTH
          </p>

          <!-- 1 dòng trắng -->
          <div class="h-5 sm:h-6"></div>

          <p class="text-sm sm:text-base text-gray-300 mb-1.5">
            Date: <span class="text-white font-medium">3-4 Oct · 3/10/2026</span>
          </p>
          <p class="text-sm sm:text-base text-gray-300 mb-1.5">
            Start trend: <span class="text-white font-medium">All day</span>
          </p>
          <p class="text-sm sm:text-base text-gray-300 mb-1.5">
            🔑 <span class="text-white font-medium">PERTH PAIAEW CHIANGMAI</span>
          </p>
          <p class="text-sm sm:text-base text-gray-300">
            #️⃣ <span class="text-red-400 font-medium">DrAllyinCNXwithPerth</span>
          </p>
        </div>

        <!-- 2 ô Gen góc dưới phải (xếp dọc) -->
        <div class="gen-stack">
          <a href="https://santa-scribe-x.lovable.app/" target="_blank" rel="noopener" class="gen-card">
            Gen 1
          </a>
          <a href="https://streetwise-copy-engine.lovable.app/?zarsrc=30&utm_source=zalo&utm_medium=zalo&utm_campaign=zalo" target="_blank" rel="noopener" class="gen-card">
            Gen 2
          </a>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
