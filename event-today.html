<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Today - PerthSanta Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body { background: #070707; min-height: 100vh; }
    body { font-family: Inter, system-ui, sans-serif; color: #fff; }
    .title-serif { font-family: "Cormorant Garamond", Georgia, serif; }

    .event-card {
      position: relative;
      width: 100%;
      max-width: 28rem;
      min-height: 13.5rem;
      border-radius: 1rem;
      overflow: hidden;
      border: 1px solid #3f3f46;
      background: #141414;
    }
    .event-card-bg {
      position: absolute;
      inset: 0;
      background: #141414;
      background-size: cover;
      background-position: center;
      opacity: 0.28;
      filter: grayscale(15%) brightness(0.75);
    }
    .event-card-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(7, 7, 7, 0.55) 0%,
        rgba(7, 7, 7, 0.75) 50%,
        rgba(7, 7, 7, 0.92) 100%
      );
    }
    .event-card-content {
      position: relative;
      z-index: 10;
      padding: 1.1rem 5.4rem 1.15rem 1.15rem;
    }
    .gen-stack {
      position: absolute;
      bottom: 0.85rem;
      right: 0.85rem;
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
      z-index: 20;
    }
    .gen-card {
      width: 3.1rem;
      height: 3.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, #2a0a0a 0%, #18181b 50%, #0c0c0c 100%);
      border: 1px solid #3f3f46;
      border-radius: 0.7rem;
      text-align: center;
      font-size: 0.68rem;
      font-weight: 600;
      color: #d4d4d8;
      text-decoration: none;
      transition: all 0.25s ease;
    }
    @media (min-width: 640px) {
      .gen-card { width: 3.4rem; height: 3.4rem; font-size: 0.72rem; }
    }
    .gen-card:hover {
      border-color: #ef4444;
      color: #fff;
      background: linear-gradient(145deg, #450a0a 0%, #1c0909 50%, #0c0c0c 100%);
      box-shadow: 0 0 14px rgba(239, 68, 68, 0.3);
      transform: translateY(-2px);
    }
  </style>
</head>
<body class="text-white">
  <div class="max-w-4xl mx-auto px-4 pt-10 pb-24">
    <a href="series-trends.html" class="inline-block text-sm text-red-400 hover:text-red-300 mb-6">← Back to Trends</a>

    <h1 class="title-serif text-4xl sm:text-5xl font-bold leading-none mb-2">
      Event <span class="text-red-500">Today</span>
    </h1>
    <p class="text-gray-400 text-sm mb-8">Live from the schedule. Updates automatically each day.</p>

    <div id="event-today-list" class="flex flex-col gap-5"></div>
  </div>

  <script>
    // Key = đúng title trong schedule.
    // image bỏ trống = nền đen. Có ảnh thì điền "images/ten.jpg" hoặc link ngoài.
    var EVENT_GENS = {
      "TOPS OF BEAUTY X GILLETTE VENUS": {
        image: "images/trendtodaysanta.jpg",
        links: [
          { name: "Gen 1", url: "https://psdxtrend.github.io/x-comment-generator/venus.html" },
          { name: "Gen 2", url: "https://psdtrendng.github.io/genSantaVenus/" }
        ]
      },
      "GO HAIR WITH PERTH": {
        image: "images/trendtodayperth.jpg",
        links: [
          { name: "Gen 1", url: "https://psdxtrend.github.io/x-comment-generator/gohair.html" },
          { name: "Gen 2", url: "https://psdtrendng.github.io/GentrendPerthgohair/" }
        ]
      }
    };

    (function () {
      var listEl = document.getElementById("event-today-list");

      function esc(s) {
        return String(s || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function bangkokToday() {
        var parts = new Intl.DateTimeFormat("en-US", {
          timeZone: "Asia/Bangkok",
          year: "numeric",
          month: "2-digit",
          day: "2-digit"
        }).formatToParts(new Date());
        var map = {};
        parts.forEach(function (p) { map[p.type] = p.value; });
        return new Date(+map.year, +map.month - 1, +map.day);
      }

      function makeDate(day, monthName, year) {
        var d = new Date(day + " " + monthName + " " + year);
        if (isNaN(d.getTime())) return null;
        d.setHours(0, 0, 0, 0);
        return d;
      }

      function parseEventRange(dateStr, monthStr) {
        var yearMatch = String(monthStr || "").match(/\d{4}/);
        var year = yearMatch ? yearMatch[0] : String(new Date().getFullYear());
        var monthMatch = String(monthStr || "").match(/[A-Za-z]+/);
        var monthFromGroup = monthMatch ? monthMatch[0] : "";
        var s = String(dateStr || "").trim();

        var range = s.match(/^(\d{1,2})\s*[-–]\s*(\d{1,2})\s+([A-Za-z]+)$/);
        if (range) {
          return {
            start: makeDate(range[1], range[3], year),
            end: makeDate(range[2], range[3], year)
          };
        }
        var single = s.match(/^(\d{1,2})\s+([A-Za-z]+)$/);
        if (single) {
          var one = makeDate(single[1], single[2], year);
          return one ? { start: one, end: one } : null;
        }
        var dayOnly = s.match(/^(\d{1,2})$/);
        if (dayOnly && monthFromGroup) {
          var oneDay = makeDate(dayOnly[1], monthFromGroup, year);
          return oneDay ? { start: oneDay, end: oneDay } : null;
        }
        return null;
      }

      function tagText(hash) {
        hash = String(hash || "").trim();
        if (!hash || hash.toUpperCase() === "TBA") return "";
        return hash.charAt(0) === "#" ? hash : "#" + hash;
      }

      function numericDate(d) {
        return d.getDate() + "/" + (d.getMonth() + 1) + "/" + d.getFullYear();
      }

      function cardHtml(it, month) {
        var range = parseEventRange(it.date, month);
        var dateLine = it.date || "";
        if (range && range.start) dateLine += " · " + numericDate(range.start);

        var time = it.note && String(it.note).toUpperCase() !== "TBA" ? it.note : "All day";
        var keyw = it.keyword && String(it.keyword).toUpperCase() !== "TBA" ? it.keyword : "";
        var hash = tagText(it.hastag || it.hashtag);
        var cfg = EVENT_GENS[it.title] || {};
        var gens = cfg.links || [];
        var bg = cfg.image
          ? ' style="background-image:url(\'' + esc(cfg.image) + '\')"'
          : "";
        var genHtml = gens.filter(function (g) { return g && g.url; }).map(function (g, i) {
          return '<a href="' + esc(g.url) + '" target="_blank" rel="noopener" class="gen-card">' +
            esc(g.name || ("Gen " + (i + 1))) + "</a>";
        }).join("");

        return (
          '<div class="event-card">' +
            '<div class="event-card-bg"' + bg + '></div>' +
            '<div class="event-card-overlay"></div>' +
            '<div class="event-card-content">' +
              '<p class="text-red-400 text-[15px] sm:text-base font-semibold tracking-wide leading-snug break-words">' +
                esc(it.title || "") + "</p>" +
              '<div class="h-3"></div>' +
              '<p class="text-sm text-gray-300 leading-relaxed break-words">Date: <span class="text-white font-medium">' +
                esc(dateLine) + "</span></p>" +
              '<p class="text-sm text-gray-300 leading-relaxed mt-0.5 break-words">Time: <span class="text-white font-medium">' +
                esc(time) + "</span></p>" +
              '<p class="text-sm text-gray-300 leading-relaxed mt-0.5 break-words">🔑 <span class="text-white font-medium">' +
                esc(keyw || "—") + "</span></p>" +
              '<p class="text-sm leading-relaxed mt-0.5 break-words"><span class="text-red-400 font-medium">' +
                esc(hash || "—") + "</span></p>" +
            "</div>" +
            (genHtml ? '<div class="gen-stack">' + genHtml + "</div>" : "") +
          "</div>"
        );
      }

      fetch("data.json?t=" + Date.now())
        .then(function (r) { return r.json(); })
        .then(function (json) {
          var months = (json.introduce && json.introduce.schedule) || [];
          var today = bangkokToday();
          var jobs = [];

          months.forEach(function (m) {
            (m.items || []).forEach(function (it) {
              var range = parseEventRange(it.date, m.month);
              if (!range || !range.start || !range.end) return;
              if (today >= range.start && today <= range.end) {
                jobs.push({ it: it, month: m.month });
              }
            });
          });

          if (!jobs.length) {
            listEl.innerHTML = '<p class="text-zinc-400">No event on the schedule today.</p>';
            return;
          }
          listEl.innerHTML = jobs.map(function (j) { return cardHtml(j.it, j.month); }).join("");
        })
        .catch(function () {
          listEl.innerHTML = '<p class="text-red-400">Cannot load schedule.</p>';
        });
    })();
  </script>
</body>
</html>
