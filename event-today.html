<!DOCTYPE html>

<head>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body { background: #070707; min-height: 100vh; }
    body { font-family: Inter, system-ui, sans-serif; color: #fff; }
    .title-serif { font-family: "Cormorant Garamond", Georgia, serif; }

    .event-card {
      position: relative;
      overflow: hidden;
      border-radius: 1rem;
      border: 1px solid #3f3f46;
      background: #141414;
    }
    .event-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: url("images/ảnh event today.jpg") center/cover no-repeat;
      opacity: 0.18;
      filter: grayscale(30%) brightness(0.7);
      z-index: 0;
    }
    .event-card-content {
      position: relative;
      z-index: 1;
    }

    .gen-card {
      width: 4.25rem;
      height: 4.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, #2a0a0a 0%, #18181b 50%, #0c0c0c 100%);
      border: 1px solid #3f3f46;
      border-radius: 0.85rem;
      text-align: center;
      padding: 0.25rem;
      transition: all 0.25s ease;
      font-size: 0.8rem;
      font-weight: 600;
      color: #d4d4d8;
      text-decoration: none;
    }
    @media (min-width: 640px) {
      .gen-card {
        width: 4.75rem;
        height: 4.75rem;
        font-size: 0.9rem;
      }
    }
    .gen-card:hover {
      border-color: #ef4444;
      color: #fff;
      background: linear-gradient(145deg, #450a0a 0%, #1c0909 50%, #0c0c0c 100%);
      box-shadow: 0 0 16px rgba(239, 68, 68, 0.35);
      transform: translateY(-3px);
    }
  </style>
</head>
<body class="text-white">
  <div class="max-w-4xl mx-auto px-4 pt-10 pb-24">
    <a href="series-trends.html" class="inline-block text-sm text-red-400 hover:text-red-300 mb-6">← Back to Trends</a>

          </p>
          
          <p class="text-sm text-gray-300">

          </p>
        </div>

</body>
</html>
