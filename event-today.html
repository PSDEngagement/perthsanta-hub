<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Today - PerthSanta Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body { background: #070707; min-height: 100vh; }
    body { font-family: Inter, system-ui, sans-serif; color: #fff; }
    .title-serif { font-family: "Cormorant Garamond", Georgia, serif; }

    /* Event card – 4:3 image as faded background */
    .event-card {
      position: relative;
      width: 100%;
      max-width: 28rem;          /* ~ max-w-md */
      aspect-ratio: 4 / 3;
      border-radius: 1rem;
      overflow: hidden;
      border: 1px solid #3f3f46;
      background: #141414;
    }
    .event-card-bg {
      position: absolute;
      inset: 0;
      background-image: url("images/piceventtoday.jpg");
      background-size: cover;
      background-position: center;
      opacity: 0.28;             /* faded / submerged */
      filter: grayscale(15%) brightness(0.75);
    }
    .event-card-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(7, 7, 7, 0.55) 0%,
        rgba(7, 7, 7, 0.75) 50%,
        rgba(7, 7, 7, 0.92) 100%
      );
    }
    .event-card-content {
      position: relative;
      z-index: 10;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 1.1rem 1.15rem 1rem;
    }

    /* Gen buttons – square, stacked bottom-right */
    .gen-stack {
      position: absolute;
      bottom: 0.85rem;
      right: 0.85rem;
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
      z-index: 20;
    }
    .gen-card {
      width: 3.1rem;
      height: 3.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, #2a0a0a 0%, #18181b 50%, #0c0c0c 100%);
      border: 1px solid #3f3f46;
      border-radius: 0.7rem;
      text-align: center;
      font-size: 0.68rem;
      font-weight: 600;
      color: #d4d4d8;
      text-decoration: none;
      transition: all 0.25s ease;
    }
    @media (min-width: 640px) {
      .gen-card { width: 3.4rem; height: 3.4rem; font-size: 0.72rem; }
    }
    .gen-card:hover {
      border-color: #ef4444;
      color: #fff;
      background: linear-gradient(145deg, #450a0a 0%, #1c0909 50%, #0c0c0c 100%);
      box-shadow: 0 0 14px rgba(239, 68, 68, 0.3);
      transform: translateY(-2px);
    }
  </style>
</head>
<body class="text-white">
  <div class="max-w-4xl mx-auto px-4 pt-10 pb-24">
    <a href="series-trends.html" class="inline-block text-sm text-red-400 hover:text-red-300 mb-6">← Back to Trends</a>

    <h1 class="title-serif text-4xl sm:text-5xl font-bold leading-none mb-2">
      Event <span class="text-red-500">Today</span>
    </h1>
    <p class="text-gray-400 text-sm mb-8">Live from the schedule. Updates automatically each day.</p>

    <!-- ===== Event card ===== -->
    <div class="event-card">
      <!-- faded background image -->
      <div class="event-card-bg"></div>
      <div class="event-card-overlay"></div>

      <!-- left-aligned content -->
      <div class="event-card-content">
        <div class="pr-16">   <!-- leave space for gen buttons -->
          <p class="text-red-400 text-[15px] sm:text-base font-semibold tracking-wide leading-snug">
            DR.ALLY PAI AEW TUAY KAN TEE CHANG MAI WITH PERTH
          </p>

          <!-- blank line -->
          <div class="h-3"></div>

          <p class="text-sm text-gray-300 leading-relaxed">
            Date: <span class="text-white font-medium">3-4 Oct · 3/10/2026</span>
          </p>
          <p class="text-sm text-gray-300 leading-relaxed mt-0.5">
            Start trend: <span class="text-white font-medium">All day</span>
          </p>
          <p class="text-sm text-gray-300 leading-relaxed mt-0.5">
            🔑 <span class="text-white font-medium">PERTH PAIAEW CHIANGMAI</span>
          </p>
          <p class="text-sm text-gray-300 leading-relaxed mt-0.5">
            <span class="text-red-400 font-medium">#️⃣DrAllyinCNXwithPerth</span>
          </p>
        </div>
      </div>

      <!-- Gen 1 & Gen 2 – stacked bottom-right -->
      <div class="gen-stack">
        <a href="https://santa-scribe-x.lovable.app/"
           target="_blank" rel="noopener"
           class="gen-card">
          Gen 1
        </a>
        <a href="https://streetwise-copy-engine.lovable.app/?zarsrc=30&utm_source=zalo&utm_medium=zalo&utm_campaign=zalo"
           target="_blank" rel="noopener"
           class="gen-card">
          Gen 2
        </a>
      </div>
    </div>
  </div>
</body>
</html>
