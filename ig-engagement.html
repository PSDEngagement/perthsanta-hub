<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram Engagement - PerthSanta Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #070707; min-height: 100vh; }
    .card { background: #18181b; border: 1px solid #3f3f46; border-radius: 1rem; }
  </style>
</head>
<body class="text-white">
  <div class="max-w-5xl mx-auto px-4 pt-8 pb-6">
    <h1 class="text-3xl font-bold">Instagram Engagement</h1>
  </div>
  <div id="ig-list" class="max-w-5xl mx-auto px-4 grid grid-cols-1 md:grid-cols-2 gap-4 pb-20"></div>
  <script src="common.js"></script>
  <script>
    function formatNum(n) { return (Number(n) || 0).toLocaleString("en-US"); }
    fetch("data.json?t=" + Date.now())
      .then(function (r) { return r.json(); })
      .then(function (data) {
        var list = document.getElementById("ig-list");
        var posts = data.instagram || [];
        list.innerHTML = "";
        if (!posts.length) {
          list.textContent = "No posts yet.";
          return;
        }
        posts.sort(function (a, b) {
          return String(b.date || "").localeCompare(String(a.date || ""));
        });
        posts.forEach(function (post) {
          var card = document.createElement("div");
          card.className = "card p-4";
          var gens = "";
          (post.generators || []).forEach(function (g) {
            gens += '<a href="' + (g.url || "#") + '" target="_blank" rel="noopener" class="inline-block bg-red-700 text-white text-sm rounded-full px-4 py-2 mr-2 mb-2">' + (g.name || "Gen") + "</a>";
          });
          card.innerHTML =
            "<p class='text-red-400 text-xs'>" + (post.handle || "") + " · " + (post.date || "") + "</p>" +
            "<h3 class='font-bold text-base my-1'></h3>" +
            "<p class='text-xs text-gray-400 mb-3'>Like " + formatNum(post.like) + " · Comment " + formatNum(post.comment) + " · Share " + formatNum(post.share) + "</p>" +
            "<div>" + gens +
              '<a href="' + (post.postUrl || "#") + '" target="_blank" rel="noopener" class="inline-block bg-zinc-800 text-white text-sm rounded-full px-4 py-2">Open Instagram</a>' +
            "</div>";
          card.querySelector("h3").textContent = post.title || "Instagram post";
          list.appendChild(card);
        });
      })
      .catch(function (e) {
        document.getElementById("ig-list").textContent = "Failed to load data.json";
      });
  </script>
</body>
</html>
