<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram Engagement - PerthSanta Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #070707; min-height: 100vh; }
    .card { transition: all 0.25s ease; }
    .card:hover { transform: translateY(-3px); box-shadow: 0 10px 25px rgba(185, 28, 28, 0.2); }
  </style>
</head>
<body class="text-white">
  <div class="max-w-5xl mx-auto px-4 pt-8 pb-6">
    <h1 class="text-3xl md:text-4xl font-bold mb-2">Instagram Engagement</h1>
  </div>
  <div id="ig-list" class="max-w-5xl mx-auto px-4 grid grid-cols-1 md:grid-cols-2 gap-4 pb-20"></div>
  <script src="common.js"></script>
  <script>
    function formatNum(n) { return (Number(n) || 0).toLocaleString("en-US"); }
    function fallbackThumb(handle) {
      var label = (handle || "@IG").replace("@", "");
      return "data:image/svg+xml;utf8," + encodeURIComponent(
        "<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><rect width='100%' height='100%' fill='#7f1d1d'/><text x='120' y='128' text-anchor='middle' font-size='16' fill='#fecaca' font-family='sans-serif'>@" + label + "</text></svg>"
      );
    }
    fetch("data.json?t=" + Date.now())
      .then(function (r) { return r.json(); })
      .then(function (data) {
        var posts = (data.instagram || []).slice().sort(function (a, b) {
          return String(b.date || "").localeCompare(String(a.date || ""));
        });
        var list = document.getElementById("ig-list");
        list.innerHTML = "";
        if (!posts.length) {
          list.innerHTML = '<p class="text-gray-500">No posts yet.</p>';
          return;
        }
        posts.forEach(function (post) {
          var gens = (post.generators || []).map(function (g) {
            return '<a href="' + g.url + '" target="_blank" rel="noopener" class="inline-block bg-red-700 hover:bg-red-600 text-white text-sm rounded-full px-4 py-2">' + (g.name || "Generator") + " →</a>";
          }).join("");
          var card = document.createElement("article");
          card.className = "card bg-zinc-900 border border-zinc-700 rounded-2xl overflow-hidden";
          card.innerHTML =
            '<div class="flex gap-4 p-4">' +
              '<img class="w-24 h-24 object-cover rounded-lg bg-zinc-800 flex-shrink-0" alt="" src="' + (post.image || "") + '">' +
              '<div class="min-w-0 flex-1">' +
                '<p class="text-red-400 text-xs">' + (post.handle || "") + (post.date ? " · " + post.date : "") + "</p>" +
                "<h3 class=\"font-bold text-base mt-0.5 mb-2\">" + (post.title || "Instagram post") + "</h3>" +
                '<p class="text-xs text-gray-400 mb-3">Like <span class="text-red-400">' + formatNum(post.like) + "</span> · Comment <span class="text-red-400">' + formatNum(post.comment) + "</span> · Share <span class="text-red-400">' + formatNum(post.share) + "</span></p>" +
                '<div class="flex flex-wrap gap-2">' + gens +
                  '<a href="' + (post.postUrl || "#") + '" target="_blank" rel="noopener" class="inline-block bg-zinc-800 hover:bg-red-700 text-white text-sm rounded-full px-4 py-2">Open Instagram →</a>' +
                "</div></div></div>";
          var img = card.querySelector("img");
          img.addEventListener("error", function () { img.src = fallbackThumb(post.handle); });
          if (!post.image) img.src = fallbackThumb(post.handle);
          list.appendChild(card);
        });
      })
      .catch(function () {
        document.getElementById("ig-list").innerHTML = '<p class="text-red-500">Failed to load data.json</p>';
      });
  </script>
</body>
</html>
