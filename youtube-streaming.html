<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Streaming - PerthSanta Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #070707; min-height: 100vh; }
    .card { transition: all 0.25s ease; }
    .card:hover { transform: translateY(-3px); box-shadow: 0 10px 25px rgba(185, 28, 28, 0.2); }
  </style>
</head>
<body class="text-white">
  <div class="max-w-5xl mx-auto px-4 pt-8 pb-6">
    <h1 class="text-3xl md:text-4xl font-bold mb-2">YouTube Streaming</h1>
    <p class="text-gray-400">Music streaming targets on YouTube</p>
  </div>
  <div id="songs-list" class="max-w-5xl mx-auto px-4 pb-20">
    <p class="text-gray-500">Loading...</p>
  </div>
  <script src="yt-config.js"></script>
  <script src="common.js"></script>
  <script>
    function formatNumber(num) { return Number(num || 0).toLocaleString(); }
    function calculateTarget(currentViews, baseTarget) {
      let target = baseTarget;
      while (currentViews >= target) target += 100000;
      return target;
    }
    function makeCard(song, statsMap) {
      const currentViews = statsMap[song.videoId] ? statsMap[song.videoId].views : 0;
      const baseTarget = parseInt((song.target || "0").toString().replace(/,/g, "")) || 100000;
      const currentTarget = calculateTarget(currentViews, baseTarget);
      const remaining = Math.max(0, currentTarget - currentViews);
      const pct = currentTarget ? Math.min(100, Math.round(currentViews / currentTarget * 100)) : 0;
      const card = document.createElement("div");
      card.className = "card bg-zinc-900 border border-zinc-700 rounded-2xl overflow-hidden";
      card.innerHTML =
        '<div class="flex gap-4 p-4">' +
          '<img src="https://img.youtube.com/vi/' + song.videoId + '/mqdefault.jpg" alt="" class="w-28 sm:w-32 h-20 sm:h-24 object-cover rounded-lg bg-zinc-800 flex-shrink-0">' +
          '<div class="min-w-0 flex-1">' +
            '<h3 class="font-bold text-base leading-snug line-clamp-2 mb-2">' + song.title + '</h3>' +
            '<p class="text-xs text-gray-400">Views <span class="text-white">' + formatNumber(currentViews) + '</span> · Target <span class="text-red-400">' + formatNumber(currentTarget) + '</span></p>' +
            '<p class="text-xs text-gray-400 mb-2">Remaining <span class="text-yellow-400">' + formatNumber(remaining) + '</span> · ' + pct + '%</p>' +
            '<div class="h-1.5 bg-zinc-800 rounded-full overflow-hidden mb-3"><div class="h-full bg-red-600" style="width:' + pct + '%"></div></div>' +
            '<a href="https://www.youtube.com/watch?v=' + song.videoId + '" target="_blank" rel="noopener" class="inline-block bg-red-700 hover:bg-red-600 text-white text-sm px-4 py-2 rounded-full">Watch →</a>' +
          '</div></div>';
      return card;
    }
    fetch("data.json?t=" + Date.now())
      .then(res => res.json())
      .then(async function (data) {
        const songs = data.youtube || [];
        const container = document.getElementById("songs-list");
        container.innerHTML = "";
        if (!songs.length) {
          container.innerHTML = '<p class="text-gray-500">No songs added yet.</p>';
          return;
        }
        const key = window.YOUTUBE_API_KEY || "";
        let statsMap = {};
        if (key) {
          try {
            const res = await fetch("https://www.googleapis.com/youtube/v3/videos?part=statistics&id=" + songs.map(s => s.videoId).join(",") + "&key=" + key);
            const json = await res.json();
            (json.items || []).forEach(function (item) {
              statsMap[item.id] = { views: parseInt(item.statistics.viewCount || 0) };
            });
          } catch (e) {}
        }
        const order = [
          { id: "trailer", label: "Trailer/Pilot" },
          { id: "ost", label: "OST" },
          { id: "perth", label: "Perth Solo" },
          { id: "jasper", label: "JASP.ER" }
        ];
        order.forEach(function (sec) {
          const items = songs.filter(function (s) { return (s.group || "ost") === sec.id; });
          if (!items.length) return;
          const h = document.createElement("h2");
          h.className = "text-xl font-bold mt-2 mb-3";
          h.textContent = sec.label;
          container.appendChild(h);
          const grid = document.createElement("div");
          grid.className = "grid grid-cols-1 md:grid-cols-2 gap-4 mb-8";
          items.forEach(function (s) { grid.appendChild(makeCard(s, statsMap)); });
          container.appendChild(grid);
        });
      })
      .catch(function () {
        document.getElementById("songs-list").innerHTML = '<p class="text-red-500">Error loading data.json</p>';
      });
  </script>
</body>
</html>
