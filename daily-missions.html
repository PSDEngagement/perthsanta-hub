<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Missions - PerthSanta Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #070707; min-height: 100vh; }
    .card { transition: all 0.25s ease; }
    .card:hover { transform: translateY(-3px); box-shadow: 0 10px 25px rgba(185, 28, 28, 0.2); }
    .unit { background: #18181b; border: 1px solid #3f3f46; border-radius: 1rem; }
  </style>
</head>
<body class="text-white">
  <div class="max-w-5xl mx-auto px-4 pt-8 pb-6">
    <h1 class="text-3xl md:text-4xl font-bold mb-2">Daily Missions</h1>
  </div>
  <section class="max-w-5xl mx-auto px-4 mb-10">
    <div class="bg-zinc-900 border border-zinc-700 rounded-2xl p-5 sm:p-8 text-center">
      <p id="cd-badge" class="inline-block bg-zinc-800 border border-zinc-600 rounded-full px-4 py-1.5 text-sm font-medium mb-3">Countdown</p>
      <p id="cd-title" class="text-gray-400 text-sm md:text-base mb-6 px-1"></p>
            <div class="grid grid-cols-4 gap-1.5 sm:gap-3 max-w-lg mx-auto">
        <div class="unit px-1 py-2.5 sm:px-3 sm:py-4"><p id="cd-d" class="text-xl sm:text-4xl font-bold text-red-500">00</p><p class="text-[9px] sm:text-[11px] text-gray-400 uppercase mt-1">Days</p></div>
        <div class="unit px-1 py-2.5 sm:px-3 sm:py-4"><p id="cd-h" class="text-xl sm:text-4xl font-bold text-red-500">00</p><p class="text-[9px] sm:text-[11px] text-gray-400 uppercase mt-1">Hours</p></div>
        <div class="unit px-1 py-2.5 sm:px-3 sm:py-4"><p id="cd-m" class="text-xl sm:text-4xl font-bold text-red-500">00</p><p class="text-[9px] sm:text-[11px] text-gray-400 uppercase mt-1">Minutes</p></div>
        <div class="unit px-1 py-2.5 sm:px-3 sm:py-4"><p id="cd-s" class="text-xl sm:text-4xl font-bold text-red-500">00</p><p class="text-[9px] sm:text-[11px] text-gray-400 uppercase mt-1">Seconds</p></div>
      </div>
      <p id="cd-done" class="hidden mt-5 text-red-400 font-medium">It's time.</p>
    </div>
  </section>
  <section class="max-w-5xl mx-auto px-4 mb-10">
    <h2 class="text-xl font-bold mb-4">PerthSanta Series</h2>
    <div id="series-list" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
  </section>
  <section class="max-w-5xl mx-auto px-4 pb-20">
    <h2 class="text-xl font-bold mb-1">Rating Mission</h2>
    <p class="text-gray-400 text-sm mb-4">Rate and review PerthSanta series on these platforms.</p>
    <div id="rating-list" class="grid grid-cols-2 sm:grid-cols-3 gap-4"></div>
  </section>
  <script src="common.js"></script>
  <script>
    function pad(n) { return String(n).padStart(2, "0"); }
    function startCountdown(iso) {
      const target = new Date(iso).getTime();
      const dEl = document.getElementById("cd-d");
      const hEl = document.getElementById("cd-h");
      const mEl = document.getElementById("cd-m");
      const sEl = document.getElementById("cd-s");
      const done = document.getElementById("cd-done");
      function tick() {
        let diff = target - Date.now();
        if (isNaN(target) || diff <= 0) {
          dEl.innerText = hEl.innerText = mEl.innerText = sEl.innerText = "00";
          done.classList.remove("hidden");
          return;
        }
        const days = Math.floor(diff / 86400000); diff %= 86400000;
        const hours = Math.floor(diff / 3600000); diff %= 3600000;
        const mins = Math.floor(diff / 60000);
        const secs = Math.floor((diff % 60000) / 1000);
        dEl.innerText = pad(days); hEl.innerText = pad(hours);
        mEl.innerText = pad(mins); sEl.innerText = pad(secs);
      }
      tick(); setInterval(tick, 1000);
    }
    fetch("data.json?t=" + Date.now())
      .then(r => r.json())
      .then(data => {
        const dm = data.dailyMissions || {};
        const cd = dm.countdown || {};
        document.getElementById("cd-badge").innerText = cd.badge || "COUNTDOWN";
        document.getElementById("cd-title").innerText = cd.title || "";
        if (cd.target) startCountdown(cd.target);
        const seriesBox = document.getElementById("series-list");
        (dm.series || []).forEach(s => {
          const links = (s.platforms || []).filter(p => p.url).map(p =>
            '<a href="'+p.url+'" target="_blank" rel="noopener" class="inline-block bg-red-700 hover:bg-red-600 text-white text-sm rounded-full px-4 py-2.5">'+p.name+" →</a>"
          ).join("") || '<p class="text-sm text-gray-500">No watch links yet</p>';
          const el = document.createElement("div");
                    el.className = "card bg-zinc-900 border border-zinc-700 rounded-2xl overflow-hidden";
          var poster = s.poster
            ? '<img src="'+s.poster+'" alt="" class="w-28 sm:w-32 h-40 sm:h-44 object-cover bg-zinc-800 flex-shrink-0">'
            : '<div class="w-28 sm:w-32 h-40 sm:h-44 bg-zinc-800 flex items-center justify-center text-xs text-gray-500 flex-shrink-0">Poster</div>';
          el.innerHTML =
            '<div class="flex gap-4 p-4">'+
              poster+
              '<div class="min-w-0 flex-1 py-1">'+
                '<h3 class="text-lg font-bold">'+(s.title||"")+"</h3>"+
                '<p class="text-sm text-gray-400 mb-4">'+(s.subtitle||"")+"</p>"+
                '<div class="flex flex-wrap gap-2">'+links+"</div>"+
              "</div>"+
            "</div>";
          seriesBox.appendChild(el);
        });
        const rateBox = document.getElementById("rating-list");
        (dm.ratings || []).forEach(r => {
          const el = document.createElement("a");
          el.href = r.url || "#";
          if (r.url) { el.target = "_blank"; el.rel = "noopener"; }
          el.className = "card bg-zinc-900 border border-zinc-700 rounded-2xl p-5 text-center block min-h-[120px]";
          el.innerHTML = '<p class="text-xl font-bold mb-3">'+(r.name||"")+"</p>"+
            '<span class="inline-block bg-red-700 hover:bg-red-600 text-white text-sm rounded-full px-4 py-2">Rate now</span>';
          rateBox.appendChild(el);
        });
      })
      .catch(function () {
        document.getElementById("series-list").innerHTML = '<p class="text-red-500">Failed to load data.json</p>';
      });
  </script>
</body>
</html>
